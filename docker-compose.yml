services:
  postgres:
    image: postgres:16-alpine
    container_name: friendly-mail-postgres
    environment:
      POSTGRES_DB: friendly_mail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - friendly-mail-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d friendly_mail"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: friendly-mail-redis
    ports:
      - "6379:6379"
    volumes:
      - friendly-mail-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  friendly-mail-postgres-data:
  friendly-mail-redis-data:
